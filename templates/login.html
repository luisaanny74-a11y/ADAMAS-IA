<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAMAS | Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:    #050505;
            --red-core:   #cc0000;
            --red-bright: #ff2222;
            --red-dim:    #8B0000;
            --red-glow:   rgba(255, 0, 0, 0.18);
            --border-mid: rgba(255, 0, 0, 0.2);
            --text-red:   #ff3333;
            --text-dim:   rgba(255, 255, 255, 0.35);
            --font-mono:  'Share Tech Mono', monospace;
            --font-ui:    'Rajdhani', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, #150303 0%, #050505 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            color: rgba(255, 255, 255, 0.88);
            padding: 20px;
        }

        .card {
            background: rgba(6, 0, 0, 0.92);
            border: 1px solid rgba(255, 0, 0, 0.25);
            border-radius: 10px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.08), 0 0 120px rgba(0,0,0,0.8);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-gem {
            display: block;
            font-size: 2.5rem;
            color: var(--red-bright);
            text-shadow: 0 0 20px var(--red-bright);
            margin-bottom: 8px;
        }

        .logo-text {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--text-red);
            text-transform: uppercase;
        }

        .logo-sub {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Abas Login / Cadastro */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.15);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: var(--font-ui);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-btn.active {
            color: var(--text-red);
            border-bottom-color: var(--red-core);
        }

        /* Formulários */
        .form { display: none; flex-direction: column; gap: 16px; }
        .form.active { display: flex; }

        .field { display: flex; flex-direction: column; gap: 6px; }

        .field label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .field input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input:focus {
            border-color: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.08);
        }

        .field input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-submit {
            background: var(--red-dim);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            background: var(--red-core);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mensagem de erro/sucesso */
        .msg {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-align: center;
            padding: 8px 12px;
            border-radius: 4px;
            display: none;
            letter-spacing: 0.3px;
            line-height: 1.5;
        }

        .msg.erro {
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 0, 0, 0.25);
            color: #ff6666;
            display: block;
        }

        .msg.sucesso {
            background: rgba(0, 180, 80, 0.08);
            border: 1px solid rgba(0, 180, 80, 0.25);
            color: #00cc66;
            display: block;
        }

        .rodape {
            margin-top: 24px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="logo-gem">◈</span>
            <div class="logo-text">ADAMAS</div>
            <div class="logo-sub">Protocolo de Inteligência</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="trocarAba('login')">Entrar</button>
            <button class="tab-btn" onclick="trocarAba('cadastro')">Cadastrar</button>
        </div>

        <!-- FORM LOGIN -->
        <form class="form active" id="form-login" onsubmit="fazerLogin(event)">
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="login-senha" placeholder="••••••••" required>
            </div>
            <div class="msg" id="msg-login"></div>
            <button type="submit" class="btn-submit" id="btn-login">ACESSAR PROTOCOLO</button>
        </form>

        <!-- FORM CADASTRO -->
        <form class="form" id="form-cadastro" onsubmit="fazerCadastro(event)">
            <div class="field">
                <label>Nome</label>
                <input type="text" id="cad-nome" placeholder="Seu nome" required>
            </div>
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="cad-email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label>Senha <span style="color:var(--text-dim);font-size:0.6rem;">(mín. 6 caracteres)</span></label>
                <input type="password" id="cad-senha" placeholder="••••••••" required minlength="6">
            </div>
            <div class="msg" id="msg-cadastro"></div>
            <button type="submit" class="btn-submit" id="btn-cadastro">CRIAR CONTA</button>
        </form>

        <div class="rodape">ADAMAS IA — Seus dados são seus. Senhas criptografadas com bcrypt.</div>
    </div>

    <script>
        function trocarAba(aba) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && aba === 'login') || (i === 1 && aba === 'cadastro'));
            });
            document.getElementById('form-login').classList.toggle('active', aba === 'login');
            document.getElementById('form-cadastro').classList.toggle('active', aba === 'cadastro');
            limparMensagens();
        }

        function limparMensagens() {
            ['msg-login', 'msg-cadastro'].forEach(id => {
                const el = document.getElementById(id);
                el.className = 'msg';
                el.textContent = '';
            });
        }

        function mostrarMsg(id, texto, tipo) {
            const el = document.getElementById(id);
            el.textContent = texto;
            el.className = `msg ${tipo}`;
        }

        async function fazerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = 'VERIFICANDO...';
            limparMensagens();

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value.trim(),
                        senha: document.getElementById('login-senha').value
                    })
                });
                const data = await res.json();

                if (data.ok) {
                    mostrarMsg('msg-login', `Bem-vindo, ${data.nome}. Redirecionando...`, 'sucesso');
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    mostrarMsg('msg-login', data.erro, 'erro');
                    btn.disabled = false;
                    btn.textContent = 'ACESSAR PROTOCOLO';
                }
            } catch {
                mostrarMsg('msg-login', 'Erro de conexão com o servidor.', 'erro');
                btn.disabled = false;
                btn.textContent = 'ACESSAR PROTOCOLO';
            }
        }

        async function fazerCadastro(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-cadastro');
            btn.disabled = true;
            btn.textContent = 'CRIANDO CONTA...';
            limparMensagens();

            try {
                const res = await fetch('/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome:  document.getElementById('cad-nome').value.trim(),
                        email: document.getElementById('cad-email').value.trim(),
                        senha: document.getElementById('cad-senha').value
                    })
                });
                const data = await res.json();

                if (data.ok) {
                    mostrarMsg('msg-cadastro', `Conta criada! Bem-vindo, ${data.nome}.`, 'sucesso');
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    mostrarMsg('msg-cadastro', data.erro, 'erro');
                    btn.disabled = false;
                    btn.textContent = 'CRIAR CONTA';
                }
            } catch {
                mostrarMsg('msg-cadastro', 'Erro de conexão com o servidor.', 'erro');
                btn.disabled = false;
                btn.textContent = 'CRIAR CONTA';
            }
        }
    </script>
</body>
</html>
